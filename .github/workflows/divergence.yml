name: Divergence visualization checks

on:
  pull_request:
    paths:
      - 'tools/divergence-explorer/**'
      - 'tests/divergence/**'
      - '.github/workflows/divergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/divergence-explorer/requirements.txt
      - run: python -m unittest discover -s tests/divergence -v
      - run: node --check tools/divergence-explorer/static/discrepancy-explorer.js
      - run: node --check tools/divergence-explorer/static/discrepancy-examples.js
