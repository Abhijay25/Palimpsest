name: Divergence visualization checks

on:
  pull_request:
    paths:
      - 'tools/divergence-explorer/**'
      - 'tools/language-gap-explorer/**'
      - 'docs/explorations/**'
      - 'AGENTS.md'
      - 'tests/divergence/**'
      - '.github/workflows/divergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/divergence-explorer/requirements.txt
      - run: python -m unittest discover -s tests/divergence -v
      - run: node --check tools/divergence-explorer/static/discrepancy-explorer.js
      - run: node --check tools/divergence-explorer/static/discrepancy-examples.js

  research-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Flask==3.1.3 PyMySQL==1.2.4 requests==2.34.2 numpy==2.4.6 tokenizers==0.23.3 markdown-it-py==4.3.0
      - run: python -m unittest test_zoom_read test_api_title_gate test_question_titles test_question_search test_article_pipeline test_heatmap test_skyline test_paired_history test_historical_divergence test_discrepancy_explorer test_showcase test_update_issues test_decisions_only
        working-directory: tools/language-gap-explorer
      - run: node test_skyline_model.js
        working-directory: tools/language-gap-explorer
      - run: node --check static/constellation.js
        working-directory: tools/language-gap-explorer
