# Optional private BGE-M3 query encoder for apps/library; no public route.
services:
  ollama:
    image: ${NEOWIKI_OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: [catalog]
    restart: unless-stopped
    ports: ["127.0.0.1:11435:11434"]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 10m
    volumes: [ollama-models:/root/.ollama]
    mem_limit: 3g
    cpus: 1.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  ollama-models:
