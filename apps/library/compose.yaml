services:
  vectors:
    image: ${LIBRARY_MARIADB_IMAGE}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: library
      MARIADB_USER: library
      MARIADB_PASSWORD_FILE: /run/secrets/library-password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/root-password
    ports: ['127.0.0.1:48184:3306']
    volumes:
      - ${LIBRARY_DATA_ROOT}/vector-data:/var/lib/mysql
      - ${LIBRARY_DATA_ROOT}/database-password:/run/secrets/library-password:ro
      - ${LIBRARY_DATA_ROOT}/database-root-password:/run/secrets/root-password:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 3s
      timeout: 5s
      retries: 40
