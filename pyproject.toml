[project]
name = "palimpsest"
version = "0.1.0"
description = "Wikipedia diff-verification bias detector MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "httpx",
    "mwparserfromhell",
    "pyarrow",
    "python-dotenv",
    "google-genai==3.3.0",
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest", "mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["palimpsest"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
