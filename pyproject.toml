[project]
name = "palimpsest"
version = "0.1.0"
description = "Wikipedia diff-verification bias detector MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "httpx",
    "mwparserfromhell",
    "pyarrow",
    "python-dotenv",
    "google-genai==3.3.0",
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
    "playwright==1.65.2",
]

[dependency-groups]
dev = ["pytest", "mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["palimpsest"]

[tool.mypy]
strict = true
# Teammates' infra, blame and library code has its own checks; strict mypy covers the detector.
exclude = ["^scripts/", "^apps/", "^infra/", "^tests/(infra|runtime|blame|blame_provenance|data|js)/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
# Same scope as mypy: teammates' infra, blame and library code keeps its own style.
extend-exclude = ["scripts", "apps", "infra", "tests/infra", "tests/runtime", "tests/blame", "tests/blame_provenance", "tests/data", "tests/js"]
